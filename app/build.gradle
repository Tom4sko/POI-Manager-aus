
plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation files('libs/algs4.jar')
    implementation libs.guava
    implementation 'org.jxmapviewer:jxmapviewer2:2.8.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'com.example.semestralka2.App'
    applicationName = 'POIManager'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('jar') {
    archiveBaseName = 'POIManager'
}

// Prenositeľná Windows aplikácia s vlastnou Javou
tasks.register('packageWindowsApp', Exec) {
    dependsOn tasks.named('installDist')

    def installDirectory = layout.buildDirectory.dir('install/POIManager')
    def outputDirectory = layout.buildDirectory.dir('windows-app')

    doFirst {
        outputDirectory.get().asFile.mkdirs()
    }

    commandLine 'C:\\Users\\vegas\\.gradle\\jdks\\eclipse_adoptium-26-amd64-windows.2\\bin\\jpackage.exe',
            '--type', 'app-image',
            '--name', 'POIManager',
            '--app-version', '1.0',
            '--input', installDirectory.get().dir('lib').asFile.absolutePath,
            '--dest', outputDirectory.get().asFile.absolutePath,
            '--main-jar', 'POIManager.jar',
            '--main-class', 'com.example.semestralka2.App'
}
